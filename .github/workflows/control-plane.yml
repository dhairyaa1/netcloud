name: Build Control Plane

on:
  push:
    branches: [main]
    paths:
      - 'ApplicationLoadBalancer/control-plane/**'
      - 'netcloud-core/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build -t ${{ vars.REGISTRY }}netcloud/control-plane:${{ github.sha }} ApplicationLoadBalancer/control-plane
          docker push ${{ vars.REGISTRY }}netcloud/control-plane:${{ github.sha }}