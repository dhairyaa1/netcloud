name: Build Client App

on:
  push:
    branches: [main]
    paths:
      - 'client-app/**'
      - 'ApplicationLoadBalancer/autodiscovery-client/**'
      - 'netcloud-core/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build -t ${{ vars.REGISTRY }}netcloud/client-app:${{ github.sha }} client-app/demapp
          docker push ${{ vars.REGISTRY }}netcloud/client-app:${{ github.sha }}