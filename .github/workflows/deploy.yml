name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'ApplicationLoadBalancer/control-plane/**'

jobs:
  build-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build -t ${{ secrets.REGISTRY }}netcloud/control-plane:${{ github.sha }} ApplicationLoadBalancer/control-plane
          docker push ${{ secrets.REGISTRY }}netcloud/control-plane:${{ github.sha }}